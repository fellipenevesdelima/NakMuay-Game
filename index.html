<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NakMuay — protótipo Bangkok</title>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="stage" hidden>
    <div class="sq"><img id="stageImg" alt=""><img id="fA" class="fighter" alt=""><img id="fB" class="fighter" alt=""></div>
    <div class="dim"></div>
  </div>
  <div class="blur top"></div><div class="blur bottom"></div><div class="vignette"></div>
  <header id="hud">
    <div class="row">
      <span class="chip" id="day"></span>
      <span class="chip cash" id="cash"></span>
      <span class="chip debt" id="debt"></span>
      <span class="chip" id="payroll" hidden></span>
      <span class="grow"></span>
      <button class="mini" id="lang" aria-label="Language"></button>
      <button class="mini" id="reset"></button>
    </div>
    <div class="row meters">
      <label><span id="lMorale"></span><i><b id="mMorale"></b></i></label>
      <label><span id="lPrestige"></span><i><b id="mPrestige"></b></i></label>
    </div>
  </header>
  <section id="drawer">
    <canvas id="portrait" width="48" height="48" aria-hidden="true"></canvas>
    <div class="talk">
      <div class="who" id="who"></div>
      <p id="line"></p>
      <div id="body"></div>
      <div class="btns" id="btns"></div>
      <small id="note"></small>
    </div>
  </section>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
