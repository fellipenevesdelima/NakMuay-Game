<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NakMuay — Bangkok</title>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="stage" hidden>
    <div class="sq"><img id="stageImg" alt=""><div id="fA" class="fighter"></div><div id="fB" class="fighter"></div><div class="hit"></div></div>
    <div class="dim"></div>
  </div>
  <div class="blur top"></div><div class="blur bottom"></div><div class="vignette"></div>
  <header id="hud">
    <div class="row">
      <button class="stat time" id="sTime" data-k="time"></button>
      <button class="stat cash" id="sCash" data-k="cash"></button>
      <button class="stat fans" id="sFans" data-k="fans"></button>
      <button class="stat respect" id="sRespect" data-k="respect"></button>
      <button class="stat mood" id="sMood" data-k="mood"></button>
      <span class="grow"></span>
      <button class="mini" id="menuBtn" aria-label="Menu">☰</button>
    </div>
    <p id="hint" hidden></p>
    <div id="alerts"></div>
    <div id="menu" hidden><button id="lang"></button><button id="reset"></button><small id="note"></small></div>
  </header>
  <section id="drawer">
    <canvas id="portrait" width="48" height="48" aria-hidden="true"></canvas>
    <div class="talk">
      <div class="who" id="who"></div>
      <p id="line"></p>
      <div id="body"></div>
      <div class="btns" id="btns"></div>
    </div>
  </section>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
